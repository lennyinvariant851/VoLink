name: Bug report
description: Report a reproducible VoLink problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove IMEI, IMSI, ICCID, phone numbers and credentials before submitting."
  - type: input
    id: version
    attributes:
      label: VoLink version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Modem and firmware
      placeholder: Sierra Wireless EM7430 / firmware version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
